<title>Thread</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  /* Layout: phone-first single column (max 760px); sticky top bar carries four views; the red thread is the one brand flourish, used in the wordmark and as a short rule under each section heading */
  --bg:#F5F4F0; --surface:#FFFFFF; --fg:#1B2430; --muted:#5C6672; --line:#D9DAD5; --soft:#EBEBE6;
  --accent:#1F4E8C; --accent-ink:#FFFFFF; --accent-soft:#DDE7F4;
  --thread:#B9121B;
  --crit:#B0271F; --crit-soft:#F9E2E0; --warn:#8A5800; --warn-soft:#F7EACF; --ok:#2A7A4A; --ok-soft:#DCF0E3;
  --story:#6A4B27; --story-soft:#F4EBDD;
  --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161C; --surface:#1A2129; --fg:#E8EBEE; --muted:#9AA6B3; --line:#2E3842; --soft:#222B35;
    --accent:#8CB8F0; --accent-ink:#11161C; --accent-soft:#1E3350;
    --thread:#F0656C;
    --crit:#F2928A; --crit-soft:#3C1F1D; --warn:#E9BC63; --warn-soft:#3A2E13; --ok:#80CC9C; --ok-soft:#173224;
    --story:#D9B58A; --story-soft:#33281C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#1A2129; --fg:#E8EBEE; --muted:#9AA6B3; --line:#2E3842; --soft:#222B35;
  --accent:#8CB8F0; --accent-ink:#11161C; --accent-soft:#1E3350;
  --thread:#F0656C;
  --crit:#F2928A; --crit-soft:#3C1F1D; --warn:#E9BC63; --warn-soft:#3A2E13; --ok:#80CC9C; --ok-soft:#173224;
  --story:#D9B58A; --story-soft:#33281C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-0.01em}
h1{font-size:clamp(28px,6vw,38px);font-weight:700}
h1 span{color:var(--muted);font-weight:500;font-size:.6em;margin-left:.3em}
h2{font-size:22px;font-weight:700}
h2.rule::after{content:"";display:block;width:44px;height:2px;background:var(--thread);margin-top:8px;border-radius:2px}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{display:flex;align-items:center;gap:10px}
.logo{height:34px;width:auto;display:block;color:var(--fg)}
.brand small{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.seg{display:flex;gap:4px;margin-left:auto;background:var(--soft);padding:3px;border-radius:999px;flex-wrap:wrap}
.seg a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-size:14px;font-weight:700;white-space:nowrap}
.seg a.on{background:var(--accent);color:var(--accent-ink)}
main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px;display:grid;gap:32px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.lead{max-width:62ch}
.small{font-size:14px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.btn{font:inherit;font-weight:700;font-size:15px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.btn:focus-visible,.chip:focus-visible,.rolebtn:focus-visible,.input:focus-visible,.seg a:focus-visible,.sw:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
.sec{display:grid;gap:14px}
.holder{display:grid;gap:10px}
.why{font-family:var(--display);font-size:20px;font-weight:500;color:var(--accent)}
.code{grid-template-columns:auto 1fr;align-items:start;gap:18px}
@media (max-width:520px){.code{grid-template-columns:1fr}}
.code>div{display:grid;gap:10px;min-width:0}
.qr{background:#fff;padding:12px;border-radius:10px;width:200px;max-width:100%;display:grid;place-items:center}
.qr img,.qr canvas{max-width:100%;height:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;font-weight:700;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.ver{background:var(--ok-soft);color:var(--ok)}
.tag.self{background:var(--story-soft);color:var(--story)}
.tag.role{background:var(--accent-soft);color:var(--accent)}
.tag.std{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}
.pill.high{background:var(--crit-soft);color:var(--crit)}
.pill.medium{background:var(--warn-soft);color:var(--warn)}
.pill.low{background:var(--ok-soft);color:var(--ok)}
.group{display:grid;border-top:2px solid var(--line)}
.group h3{padding:12px 0 2px}
.group .gnote{font-size:13px;color:var(--muted);padding-bottom:4px;max-width:65ch}
.field{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.field .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.field .val{max-width:65ch}
.field.crit .val{font-weight:700}
.field.stale{border-left:4px solid var(--crit);padding-left:12px}
.field.stale .val{color:var(--crit)}
.field.due{border-left:4px solid var(--warn);padding-left:12px}
.field.due .val{color:var(--warn)}
.field .src{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag.rv.stale{background:var(--crit-soft);color:var(--crit)}
.tag.rv.due{background:var(--warn-soft);color:var(--warn)}
.tag.rv.ok{background:var(--ok-soft);color:var(--ok)}
.card.rvstale{border-left:4px solid var(--crit)}
.card.rvdue{border-left:4px solid var(--warn)}
.group.story{background:var(--story-soft);border-radius:12px;padding:4px 16px 12px;border-top:0}
.group.story .field{border-top:0}
.group.story .val{font-family:var(--display);font-size:18px;font-weight:500;line-height:1.4}
.group.aboutme{border-top-color:var(--thread)}
.permlist{display:grid;border-top:1px solid var(--line)}
.perm{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.perm span{display:grid;min-width:0}
.perm small{color:var(--muted);font-size:13px}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(18px)}
.sit{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.sit.stale{border-left:4px solid var(--crit);padding-left:12px}
.sit.due{border-left:4px solid var(--warn);padding-left:12px}
.sit .top2{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.sit .need{max-width:65ch}
.rvnote.stale{color:var(--crit);font-weight:700}
.rvnote.due{color:var(--warn);font-weight:700}
.log{display:grid;border-top:1px solid var(--line)}
.entry{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.entry time{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.entry .what{color:var(--muted);grid-column:2}
.entry.bg{border-left:4px solid var(--crit);padding-left:12px}
.entry.stale{border-left:4px solid var(--warn);padding-left:12px}
.alert{border-left:4px solid var(--crit)}
.rolegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.rolebtn{font:inherit;text-align:left;display:grid;gap:2px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.rolebtn small{color:var(--muted);font-size:13px}
.rolebtn:hover{border-color:var(--accent)}
.input{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.lbl2{font-size:14px;font-weight:700;display:block;margin-bottom:4px}
.bg{border:1px dashed var(--crit);border-radius:12px;padding:14px;display:grid;gap:10px}
.told{background:var(--story-soft);color:var(--story);padding:14px 16px;border-radius:12px;font-family:var(--display);font-size:18px;font-weight:500;max-width:65ch}
.foot{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
ol,ul{margin:0;padding-left:20px;display:grid;gap:8px;max-width:65ch}
.prose{display:grid;gap:12px;max-width:65ch}
.hard{display:grid;gap:16px}
.hard div{display:grid;gap:4px;max-width:65ch}
.table{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:560px}
th,td{text-align:left;vertical-align:top;padding:10px 12px 10px 0;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td:first-child{font-weight:700;white-space:nowrap}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:start}
.flow .arrow{align-self:center;color:var(--thread);font-size:28px;line-height:1;padding-top:40px}
.flow .col{display:grid;gap:8px;min-width:0}
.flow .col h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-bottom:4px;border-bottom:2px solid var(--line)}
.flow .col.mid h3{border-bottom-color:var(--thread);color:var(--thread)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.box b{display:block}
.box small{color:var(--muted)}
.col.mid .box{border-color:var(--thread)}
@media (max-width:640px){.flow{grid-template-columns:1fr}.flow .arrow{padding:0;text-align:center;transform:rotate(90deg)}}
.stake{display:grid;gap:10px}
.stk{display:grid;grid-template-columns:1fr;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
@media (min-width:640px){.stk{grid-template-columns:1.1fr 1.6fr 1.3fr;gap:14px}}
.stk div{min-width:0;font-size:15px}
.stk .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;font-weight:700}
.red{color:var(--thread)}
.hero{display:grid;gap:14px;padding-block:8px 4px}
.hero .big{font-family:var(--display);font-weight:700;font-size:clamp(34px,8vw,56px);line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.hero .big em{font-style:normal;color:var(--thread)}
.hero .logo{height:56px}
.scenes{display:grid;gap:12px}
.scene{display:grid;gap:6px;padding:14px 16px;border-left:3px solid var(--thread);background:var(--surface);border-radius:0 12px 12px 0}
.scene p{max-width:60ch}
.scene .who{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{display:grid;gap:2px;padding:12px 0;border-top:2px solid var(--line)}
.stat .n{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .d{font-size:14px;color:var(--muted);max-width:28ch}
.principles{display:grid;gap:10px;padding:0;margin:0;list-style:none;max-width:none}
.principles li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline}
.principles li::before{content:"";width:18px;height:2px;background:var(--thread);display:block;transform:translateY(-4px)}
.cta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cta a{display:grid;gap:2px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none}
.cta a b{font-family:var(--display)}
.cta a small{color:var(--muted);font-size:13px}
.cta a:hover{border-color:var(--accent)}
.donate{border-left:4px solid var(--thread)}
.btn.thread{background:var(--thread);border-color:var(--thread);color:#fff}
.btn.thread[aria-disabled="true"]{opacity:.55;cursor:default}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}}
</style>
</head>

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=iso=>{const d=new Date(iso+'T00:00:00');return d.getDate()+' '+MONTHS[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');};
function reviewState(f){
 if(!f||!f.r)return null;
 const d=new Date(f.r+'T00:00:00');const t=new Date();t.setHours(0,0,0,0);
 const days=Math.round((d-t)/86400000);
 if(days<0)return {s:'stale',label:'Out of date since '+fmtD(f.r)};
 if(days<=14)return {s:'due',label:'Review due '+fmtD(f.r)+(days===0?', today':'')};
 return {s:'ok',label:'Next review '+fmtD(f.r)};
}
function reviewCounts(fields){const st=fields.map(reviewState).filter(Boolean);return {stale:st.filter(x=>x.s==='stale').length,due:st.filter(x=>x.s==='due').length};}
function reviewBanner(fields,advice){
 const c=reviewCounts(fields);if(!c.stale&&!c.due)return '';
 const parts=[];
 if(c.stale)parts.push(c.stale+' item'+(c.stale>1?'s are':' is')+' out of date');
 if(c.due)parts.push(c.due+(c.due>1?' are':' is')+' due for review');
 return '<section class="card '+(c.stale?'rvstale':'rvdue')+'"><p class="eyebrow">Check before acting</p><p><b>'+parts.join(' and ')+'.</b> '+advice+'</p></section>';
}
function situationState(s){
 const st=(s.fields||[]).map(id=>reviewState(FIELDS.find(f=>f.id===id))).filter(Boolean);
 return st.some(x=>x.s==='stale')?'stale':st.some(x=>x.s==='due')?'due':null;
}

  ['Care plan lines with review dates','Clinic letters and care plans','Carries a review date on each, and turns amber then red.'],
  ['Finding the record in an emergency','The National Record Locator, which ambulance crews already use for crisis and end-of-life plans','Registers Thread as a record type, so a crew can find it from the NHS number without a code.'],
  ['Who is scanning','NHS Care Identity (CIS2), DfE Sign-in, GOV.UK One Login','Hands the professional to the sign-in they already use. Issues nothing of its own.'],
  ['Consent, by role','Nothing. Today a person cannot choose who sees which part.','This is Thread’s job.'],
  ['The access log the person can read','Nothing the person can see.','This is Thread’s job.'],
  ['What happened, told once','Nothing. The story is retold to every service.','This is Thread’s job.']
 ];
 return '<section class="holder"><p class="eyebrow">How it fits</p><h1>Three new things on top of things that exist</h1>'+
  '<p class="lead">Thread adds consent by role, an access log the person can read, and a code that points at the record without carrying it. Everything else is read from, or written to, systems the NHS and schools already run. That is the whole design: make the smallest thing that gives a young person control, and attach it to what is already there.</p>'+
  '<p class="lead">The Red Book stops at five. Thread picks up at eleven, when a child starts moving through the world without a parent beside them, and it is theirs from the start.</p>'+
 '</section>'+
 '<section class="sec"><h2 class="rule">At a glance</h2>'+
  '<div class="flow">'+
   '<div class="col"><h3>Already exists</h3>'+
    '<div class="box"><b>NHS login, NHS number</b><small>Identity</small></div>'+
    '<div class="box"><b>GP record, Summary Care Record</b><small>Allergies, medicines, problems</small></div>'+
    '<div class="box"><b>PRSB About Me</b><small>The person’s own words</small></div>'+
    '<div class="box"><b>Digital ISP, EHCP Section A</b><small>The school plan</small></div>'+
    '<div class="box"><b>Shared care record</b><small>The care team</small></div>'+
    '<div class="box"><b>National Record Locator</b><small>Finding a record elsewhere</small></div>'+
    '<div class="box"><b>CIS2, DfE Sign-in, One Login</b><small>Who the professional is</small></div>'+
   '</div><div class="arrow">→</div>'+
   '<div class="col mid"><h3>Thread adds</h3>'+
    '<div class="box"><b>Consent by role</b><small>Sam decides who sees which line</small></div>'+
    '<div class="box"><b>An access log Sam can read</b><small>Every look leaves a trace</small></div>'+
    '<div class="box"><b>A code that points, never carries</b><small>Revocable in a second</small></div>'+
    '<div class="box"><b>Review dates</b><small>Amber at two weeks, red when passed</small></div>'+
    '<div class="box"><b>Told once</b><small>The account, shared by name only</small></div>'+
   '</div><div class="arrow">→</div>'+
   '<div class="col"><h3>Who reads it</h3>'+
    '<div class="box"><b>Paramedic, A&E, GP, pharmacist, physio</b><small>Through CIS2, or break-glass</small></div>'+
    '<div class="box"><b>CAMHS</b><small>Through CIS2</small></div>'+
    '<div class="box"><b>Safeguarding lead, SENCO, coach</b><small>Through DfE Sign-in or a voucher</small></div>'+
    '<div class="box"><b>Support worker, coordinator</b><small>Through a voucher</small></div>'+
    '<div class="box"><b>Each sees only their slice</b><small>And Sam sees that they looked</small></div>'+
   '</div>'+
  '</div></section>'+
 '<section class="sec"><h2 class="rule">Line by line: where each thing already lives</h2>'+
  '<div class="table"><table><thead><tr><th>In Thread</th><th>Lives today in</th><th>What Thread does</th></tr></thead><tbody>'+
  map.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>').join('')+
  '</tbody></table></div></section>'+
 '<section class="sec"><h2 class="rule">Where it lands in policy</h2>'+
  '<div class="hard">'+
   '<div><h3>Health: the Single Patient Record</h3><p>The 10 Year Health Plan (3 July 2025) commits to a Single Patient Record, reached through the NHS App and described as a patient passport, within three years. It will be the NHS’s record. Thread is the part the person controls, and the part that reaches outside health to school and support. It reads from the Single Patient Record; it does not compete with it.</p></div>'+
   '<div><h3>Education: digital Individual Support Plans</h3><p>The SEND white paper <i>Every Child Achieving and Thriving</i> (23 February 2026) proposes a digital Individual Support Plan in a standardised template for every child with Targeted or Specialist support, alongside an EHC plan for the Specialist tier, with assessments under the new system from September 2029. The child’s own words belong in both. Thread is where the child writes them once.</p></div>'+
   '<div><h3>Standards: About Me</h3><p>The PRSB About Me standard (v2.0.1) is the NHS-endorsed structure for what a person wants professionals to know about them, for adults and children, and it is meant to be implemented alongside shared care records. Thread’s person-authored section is that standard, heading for heading. It is deliberately not for clinician-recorded detail, which stays in the GP record.</p></div>'+
   '<div><h3>Emergency: the National Record Locator</h3><p>Ambulance services already use the National Record Locator to find mental health crisis plans and end-of-life plans held in other systems. Registering Thread as a record type means a crew can reach the emergency slice from the NHS number when the phone is locked.</p></div>'+
   '<div><h3>Victims: the Victims’ Code</h3><p>For a child hurt by violence, the Code promises a needs assessment and referral within two working days. Thread is where that assessment can be written once and carried to each service, rather than repeated by each one.</p></div>'+
  '</div></section>'+
 '<section class="sec"><h2 class="rule">What Thread is not</h2>'+
  '<ul><li>Not a new health record. It reads the GP record; it does not copy it.</li>'+
  '<li>Not a replacement for the ISP, the EHC plan or the shared care record. It carries the child’s words into them.</li>'+
  '<li>Not a messaging app or a social network. There is nothing to post.</li>'+
  '<li>Not a decision-maker. It displays; it does not advise, score or predict, which keeps it outside the medical device definition.</li>'+
  '<li>Not owned by anyone who would profit from the data. A charity or community interest company, or an NHS-hosted service, with the person’s consent governing every disclosure.</li></ul></section>'+
 '<section class="sec"><h2 class="rule">The hard parts</h2>'+
  '<div class="hard">'+
   '<div><h3>Proving who is scanning</h3><p>Solved for NHS staff by Care Identity and for school staff by DfE Sign-in. Youth workers, coaches and support workers have no register, so their organisation vouches for them through GOV.UK One Login. Emergencies take the break-glass route the Summary Care Record already uses: access now, recorded, reported to the person, justified afterwards.</p></div>'+
   '<div><h3>Who owns it at sixteen</h3><p>Sam is the data subject. From sixteen, young people consent to their own treatment and, in practice, to the sharing of their health information; a parent is a proxy only with their agreement. Under sixteen, the NHS App’s proxy access rules already describe how a parent acts for a child. The record goes with Sam into adulthood rather than expiring with children’s services.</p></div>'+
   '<div><h3>Clinical safety</h3><p>A clinician who acts on a stale allergy or an old dose can hurt someone. Reading clinical lines live from the GP record removes the second copy. Every other line carries provenance and a review date. A real build is assessed under DCB0129 by the maker and DCB0160 by each organisation that deploys it.</p></div>'+
   '<div><h3>Law and assurance</h3><p>Health data is special category data under UK GDPR; the lawful basis for a person-held record is explicit consent, withdrawable at any time. Before any pilot: a data protection impact assessment, the Digital Technology Assessment Criteria (DTAC), the Data Security and Protection Toolkit, PRSB conformance for About Me, and WCAG 2.2 AA. None of this is legal advice; a specialist health-data lawyer sees it before real data goes in.</p></div>'+
   '<div><h3>Trust</h3><p>A paramedic will not scan something they have never heard of. It needs one emergency department and fracture clinic, one school, one CAMHS team and one council SEND team to agree to use it, a visible mark that says what it is, and the professional bodies behind the defaults.</p></div>'+
  '</div></section>'+
 '<section class="sec"><h2 class="rule">Why the example is a road accident</h2>'+
  '<p class="lead">Sam is invented, and so is everything in the record. The example is a cycling accident so that families recovering from other kinds of injury can look at it without reliving anything. The record works the same way whatever brought a child to it: an allergy at eleven, an EHC plan, an accident, an assault. That is the point. It is nobody’s label.</p></section>';
}

/* ---------- The ask ---------- */
function renderAsk(){
 const stakes=[
  ['PRSB','Thread is an implementation of About Me v2.0.1, heading for heading, in a setting the standard was written for and rarely reaches: children, outside hospital.','A conformance review, and listing as an implementer.'],
  ['DHSC and NHS England digital, NHS App team','The Single Patient Record will need a layer the person controls and that reaches beyond health. Thread is that layer, built to read from the record rather than copy it.','A route to NHS login integration, a DTAC assessment, and a conversation about the HealthStore.'],
  ['National Record Locator team','Ambulance crews already find crisis plans this way. A person-held emergency slice is the same pattern.','Thread registered as a record type for a pilot region.'],
  ['DfE SEND reform team','The digital ISP template needs the child’s own words. About Me is an existing, endorsed structure for exactly that, and it joins the ISP to the health record without a new standard.','An About Me block in the ISP data standard, and one pilot council.'],
  ['An integrated care board and its Health Innovation Network','A small, bounded pilot with a clear question: did any young person have to tell it twice?','Twelve months, fifty young people, one hospital, one school, one council.'],
  ['One acute trust: emergency department and fracture clinic','Break-glass works the way the Summary Care Record does. Nothing new to learn.','Agreement to scan, and to log.'],
  ['One CAMHS team','Told once is trauma-informed practice made structural.','Agreement to read the account rather than ask for it.'],
  ['One secondary school and one council SEND team','The school plan is shown, not re-typed, and the child’s voice arrives already written.','Agreement to use DfE Sign-in and to export Section A from Thread.'],
  ['Young people and parents','Nothing about them without them. The defaults for every role are theirs to set.','A paid co-design panel of ten, from the first month.'],
  ['The ICO','A data protection impact assessment done early, with prior consultation if the residual risk is high.','Advice before, not enforcement after.'],
  ['Funders: SBRI Healthcare, NIHR i4i, Innovate UK, Nesta, the Health Foundation','A prototype, a paper version in use, a standards map and a pilot site lined up.','Enough to run the twelve months.']
 ];
 return '<section class="holder"><p class="eyebrow">The ask</p><h1>Who needs to say yes, and to what</h1>'+
  '<p class="lead">The ambition is deliberately small. Nothing here asks anyone to build a new system or change a standard. Each ask is for permission to connect to something that already works.</p></section>'+
 '<section class="sec"><h2 class="rule">Stakeholders</h2><div class="stake">'+
  stakes.map(s=>'<div class="stk"><div><b>'+esc(s[0])+'</b></div><div><span class="k">What they need to hear</span>'+esc(s[1])+'</div><div><span class="k">What we ask</span>'+esc(s[2])+'</div></div>').join('')+
 '</div></section>'+
 '<section class="sec"><h2 class="rule">Twelve months</h2>'+
  '<ol>'+
  '<li><b>Months 1 to 2.</b> Paper version in use with ten families. Co-design panel recruited and paid. Data protection impact assessment commissioned. Trademark cleared.</li>'+
  '<li><b>Months 3 to 5.</b> Thread holds only what Sam writes: About Me, consent by role, the code, the access log. No clinical data yet, so the risk is low and the DPIA is simple. Live with twenty young people.</li>'+
  '<li><b>Months 6 to 8.</b> NHS login for the holder. Clinical lines read live from the GP record at the pilot practice. Professionals sign in with CIS2. DTAC submitted.</li>'+
  '<li><b>Months 9 to 11.</b> DfE Sign-in for school staff. Section A exported to the pilot council. Thread registered with the National Record Locator for the pilot ambulance service.</li>'+
  '<li><b>Month 12.</b> Evaluation on one question, asked of every young person and every professional: did anyone have to tell it twice?</li>'+
  '</ol></section>'+
 '<section class="sec"><h2 class="rule">The first three asks</h2>'+
  '<p class="lead">If only three conversations happen this winter, they are these. The PRSB, for a conformance review, because that turns a prototype into an implementation. One integrated care board’s Health Innovation Network, for a pilot site, because that turns an implementation into evidence. And the DfE SEND reform team, before the ISP data standard is fixed, because a child’s words written once should reach both the health record and the school plan, and that window closes when the template does.</p></section>'+
 '<section class="sec"><h2 class="rule">Open questions</h2>'+
  '<ul><li>Who may write to the About Me section besides Sam, and how is a parent’s help shown?</li>'+
  '<li>What happens when Sam and a parent disagree about who sees what?</li>'+
  '<li>Should the police ever be a role, for example a family liaison officer after a serious incident?</li>'+
  '<li>How long does the record live, and who deletes it?</li>'+
  '<li>If Sam is unconscious and the phone is locked, is the National Record Locator route enough, or does a card in the wallet still matter?</li></ul></section>';
}

/* ---------- Home: why ---------- */
function renderHome(){
 const logo='<svg class="logo" viewBox="0 0 156 40" role="img" aria-label="Thread"><text x="0" y="30" font-family="Bricolage Grotesque, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="currentColor">Thread</text><path d="M-4 21 C 18 13, 36 29, 58 21 S 96 13, 114 21 c 8 3, 15 -1, 13 -6 c -2 -5, -10 -3, -7 2 c 3 5, 15 5, 28 1" fill="none" stroke="var(--thread)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
 const donate=DONATE_URL
  ?'<a class="btn thread" href="'+esc(DONATE_URL)+'" target="_blank" rel="noopener">Donate'+(DONATE_PLATFORM?' on '+esc(DONATE_PLATFORM):'')+'</a>'
  :'<span class="btn thread" aria-disabled="true">Donations open soon</span>';
 return '<section class="hero">'+logo+
  '<p class="big">Every new adult asks the same questions. <em>Thread</em> is the record a young person holds, so they only have to tell it once.</p>'+
  '<p class="lead">When a child is hurt, or needs support, the people who help them arrive one at a time: a paramedic, a doctor, a physio, a teacher, a counsellor, a support worker. Each one needs to know something. Each one asks. The child, or the parent, becomes the only place the whole story lives, and tells it again and again, often at the worst moments to tell it.</p>'+
  '<p class="lead">Thread turns that round. The young person holds one record. Each professional scans a code and sees only the part they need. Every look is recorded. The hard part, what happened, is written once and shared only with the people the young person chooses.</p>'+
 '</section>'+
 '<section class="sec"><h2 class="rule">Three ordinary moments</h2><div class="scenes">'+
  '<div class="scene"><span class="who">A paramedic, Saturday evening</span><p>A sixteen-year-old is unconscious. The phone is locked. The allergy is in a parent’s memory, and the parent is twenty minutes away. The crew works without it.</p></div>'+
  '<div class="scene"><span class="who">A new teacher, September</span><p>A child with an EHC plan explains, for the fourth year running, what helps and what does not. The plan is forty pages and sits in an office. The child is the summary.</p></div>'+
  '<div class="scene"><span class="who">A parent, week six</span><p>Hospital, GP, physio, CAMHS, school, a support service. Six referrals, six forms, the same questions. Nobody holds the thread except the parent, who is also the one trying to hold the child.</p></div>'+
 '</div></section>'+
 '<section class="sec"><h2 class="rule">The scale of it</h2>'+
  '<div class="stats">'+
   '<div class="stat"><span class="n">638,745</span><span class="d">children and young people in England with an EHC plan, January 2025</span></div>'+
   '<div class="stat"><span class="n">97,747</span><span class="d">new EHC plans started in 2024 alone</span></div>'+
   '<div class="stat"><span class="n">0</span><span class="d">of them hold a record that lets them choose who sees what</span></div>'+
  '</div>'+
  '<p class="small muted">Source: Department for Education, <a href="https://explore-education-statistics.service.gov.uk/find-statistics/education-health-and-care-plans/2025" target="_blank" rel="noopener">Education, health and care plans, 2025</a>. Every child with a plan, every child with an allergy, and every child recovering from an injury explains themselves to new adults each year. The number who have to is far larger than any one statistic.</p>'+
 '</section>'+
 '<section class="sec"><h2 class="rule">Why now</h2>'+
  '<div class="hard">'+
   '<div><h3>The pieces exist. Nobody has joined them from the person’s side.</h3><p>The NHS has a standard for what a person wants professionals to know about them (About Me). It has a way to find a record held elsewhere (the National Record Locator). It has sign-ins for its staff; schools have theirs. The GP record holds the allergies and the medicines. What does not exist is the thing that lets the young person point all of that at the right adult, and see who looked.</p></div>'+
   '<div><h3>Two national records are being redesigned at once.</h3><p>Health is building a Single Patient Record, reached through the NHS App, by 2028. Education is replacing most EHC plans with digital Individual Support Plans from 2029. Both will need the child’s own words. If those words are written once, in a form both can read, the child never has to tell it twice. That window is open now and closes when the templates are fixed.</p></div>'+
   '<div><h3>The Red Book proved the idea fifty years ago.</h3><p>Every baby in Britain gets a record their parents hold and every professional writes in. It stops at five. Thread picks up at eleven, when a child starts moving through the world without a parent beside them, and it belongs to the child.</p></div>'+
  '</div></section>'+
 '<section class="sec"><h2 class="rule">What we hold to</h2>'+
  '<ul class="principles">'+
   '<li><span><b>The person holds it.</b> Not the hospital, not the school, not us. From sixteen, the young person alone decides; before that, with a parent.</span></li>'+
   '<li><span><b>Nothing is copied that already exists.</b> Allergies and medicines are read from the GP record when the code is scanned. There is no second copy to go stale.</span></li>'+
   '<li><span><b>Every look leaves a trace.</b> The young person can see who read what, and when, including in an emergency.</span></li>'+
   '<li><span><b>Written once.</b> The account of what happened is written by the young person, in their words, and shared by name only. Everyone else is told they do not need to ask.</span></li>'+
   '<li><span><b>Nobody’s label.</b> Every child gets one at eleven. For most it holds an allergy, two phone numbers and what helps. It is not a victims’ record or a SEND record. It is a record.</span></li>'+
   '<li><span><b>Nobody profits from the data.</b> Run as a community interest company or charity, with the person’s consent governing every disclosure.</span></li>'+
  '</ul></section>'+
 '<section class="sec"><h2 class="rule">See it working</h2>'+
  '<p class="lead">Sam is invented, and so is everything in the record. The example is a cycling accident so that anyone can look at it without reliving anything of their own.</p>'+
  '<div class="cta">'+
   '<a href="#owner"><b>Sam’s record</b><small>Who sees what, the review dates, the access log</small></a>'+
   '<a href="#scan"><b>Scan as a professional</b><small>Pick a role, sign in, see your slice</small></a>'+
   '<a href="#fit"><b>How it fits</b><small>What exists, what Thread adds, line by line</small></a>'+
   '<a href="#ask"><b>The ask</b><small>Who needs to say yes, and the first year</small></a>'+
  '</div></section>'+
 '<section class="card donate"><p class="eyebrow">Help it happen</p>'+
  '<h2>The first money buys the unglamorous things</h2>'+
  '<p>A trademark search and filing. A data protection impact assessment by a specialist, before any real record exists. Paying a panel of ten young people to design the defaults for every role, because nothing about them should be decided without them. Paper sheets in ten families’ hands by the new year. None of it is expensive. All of it has to come before anyone in the NHS or a council can say yes.</p>'+
  '<p class="small muted">Donations go to the community interest company, not to any individual, and the accounts will be published. Until that company is registered, there is nothing to give to, and this button says so.</p>'+
  '<div class="row">'+donate+'<a class="btn" href="#ask">Read the plan</a></div>'+
  '<p class="small"><b>If you are a paramedic, an A&E clinician, a GP, a pharmacist, a physio, a safeguarding lead, a SENCO, a CAMHS clinician or a youth worker:</b> the most useful thing you can give is twenty minutes. Look at the Scan view and tell us two things. Would you scan it? What would you need to trust it?'+(CONTACT?' Write to <span class="mono">'+esc(CONTACT)+'</span>.':'')+'</p>'+
 '</section>'+
 '<p class="foot">Thread is a working prototype and a proposal. Nothing here is a live service, and no real person’s information is held anywhere in it.</p>';
}

/* ---------- Routing and events ---------- */
const main=document.getElementById('main');
function setNav(v){document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));}
function render(v){
 main.innerHTML=v==='scan'?renderScan():v==='fit'?renderFit():v==='ask'?renderAsk():v==='owner'?renderOwner():renderHome();
 setNav(v);
 if(v==='owner'&&state.showCode)drawQR();
 if(v!=='scan')window.scrollTo(0,0);
}
function currentView(){const h=(location.hash||'#home').slice(1);return h.indexOf('scan')===0?'scan':h==='fit'?'fit':h==='ask'?'ask':h==='owner'?'owner':'home';}
function route(){
 const h=(location.hash||'#home').slice(1);
 if(h.indexOf('scan')===0){
  const tok=h.slice(5);
  if(tok){scan.stale=tok!==state.token;scan.byCode=!scan.stale;
   if(scan.stale&&!state.log.some(e=>e.stale&&e.tok===tok)){state.log.push({t:now(),role:'paramedic',who:'Old code used',what:'An out-of-date code was scanned. Nothing was shown.',stale:true,tok:tok});save();}
  }else{scan.stale=false;scan.byCode=false;}
 }
 render(currentView());
}
function addLog(e){state.log.push(e);save();}

main.addEventListener('click',ev=>{
 const t=ev.target.closest('button,[data-pick],[data-role]');if(!t)return;
 const id=t.id;
 if(t.dataset.role){state.permRole=t.dataset.role;save();render('owner');return;}
 if(t.dataset.pick){scan.role=t.dataset.pick;scan.step=2;scan.bg=false;scan.preview=false;render('scan');return;}
 if(id==='toggleCode'){state.showCode=!state.showCode;save();render('owner');return;}
 if(id==='togglePause'){state.paused=!state.paused;save();render('owner');return;}
 if(id==='rotate'){state.token=newToken();save();render('owner');return;}
 if(id==='review'){state.reviewed=true;save();render('owner');return;}
 if(id==='reset'){state=fresh();save();scan={step:1,role:null,verified:'',until:0,preview:false,bg:false,stale:false,byCode:false,checking:false};render('owner');return;}
 if(id==='preview'){scan={step:3,role:state.permRole,verified:'Sam looking at the record as this role sees it. Not recorded.',until:Date.now()+30*60000,preview:true,bg:false,stale:false,byCode:false,checking:false};location.hash='#scan';return;}
 if(id==='back'){scan.step=1;render('scan');return;}
 if(id==='end'){const wasPreview=scan.preview;scan={step:1,role:null,verified:'',until:0,preview:false,bg:false,stale:false,byCode:false,checking:false};if(wasPreview){location.hash='#owner';}else{render('scan');}return;}
 if(id==='breakglass'){scan.bg=true;scan.step=3;scan.verified='Emergency access, not signed in. Recorded and reported to Sam.';scan.until=Date.now()+30*60000;state.reviewed=false;addLog({t:now(),role:scan.role,who:'Emergency access, not signed in',what:'Emergency fields only: contacts, allergies, medication, alerts',bg:true});render('scan');return;}
 if(id==='verify'){
  const reg=(document.getElementById('reg').value||'').trim()||'unnumbered';
  const nm=(document.getElementById('nm').value||'').trim()||'Name not given';
  const r=role(scan.role);const vouched=r.signin.indexOf('voucher')>=0;
  scan.checking=true;render('scan');
  setTimeout(()=>{
   const n=(state.perms[r.id]||[]).length;
   scan.checking=false;scan.step=3;scan.bg=false;scan.until=Date.now()+30*60000;
   scan.verified=nm+', '+(vouched?'reference '+reg:r.signin)+' (simulated)';
   addLog({t:now(),role:r.id,who:nm+', '+(vouched?'ref '+reg:r.signin)+' (simulated)',what:n+' of '+FIELDS.length+' fields'});
   if(currentView()==='scan')render('scan');
  },900);
  return;
 }
});
main.addEventListener('change',ev=>{
 const sw=ev.target.closest('.sw');if(!sw)return;
 const list=state.perms[state.permRole]||(state.perms[state.permRole]=[]);
 const i=list.indexOf(sw.dataset.f);
 if(sw.checked&&i<0)list.push(sw.dataset.f);
 if(!sw.checked&&i>=0)list.splice(i,1);
 save();
 const lbl=document.getElementById('permcount');if(lbl)lbl.textContent=list.length+' of '+FIELDS.length+' lines';
});
window.addEventListener('hashchange',route);

function start(data){
 if(data&&data.scan)scan=data.scan;
 route();
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){window.claude.hot.snapshot(()=>({scan:scan}));}
if(window.claude&&window.claude.hot&&window.claude.hot.ready){window.claude.hot.ready(start);}else{start(window.claude&&window.claude.hot?window.claude.hot.data:{});}
})();
</script>
